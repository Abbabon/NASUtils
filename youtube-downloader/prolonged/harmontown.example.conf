# Copy to prolonged/jobs/<name>.conf (gitignored). Sourced by prolonged.sh as shell.
URL="https://www.youtube.com/playlist?list=PLhnyTCcNcaceutNO3CeRSWGuMyqqsN1mO"
OUTPUT="/Volumes/Assets/Podcasts/Harmontown/Video"
COOKIES="$HOME/youtube-cookies.txt"   # secret, never commit
BATCH=20            # max videos per run
DELAY=100           # base seconds between videos (+/-25% jitter)
INTERVAL_HOURS=4    # time between runs
MAX_BOT_FAILURES=3  # stop the run after this many consecutive "not a bot" blocks
