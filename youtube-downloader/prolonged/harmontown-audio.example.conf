# Copy to prolonged/jobs/<name>.conf (gitignored). Sourced by prolonged.sh as shell.
# TYPE=podcast runs podcast-downloader/podcast_downloader.py (no cookies, no batching).
TYPE=podcast
FEED="https://feeds.megaphone.fm/harmontown"
OUTPUT="/Volumes/Assets/Podcasts/Harmontown/Audio"
INTERVAL_HOURS=24   # time between runs (only new episodes after the first full run)
PAUSE=3             # seconds between episode downloads
